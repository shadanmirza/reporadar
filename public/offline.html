<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — RepoRadar</title>
  <style>
    body { font-family: system-ui; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f9fafb; text-align: center; }
    .box { padding: 2rem; }
    h1 { color: #1f2937; }
    p { color: #6b7280; }
    button { padding: 0.75rem 1.5rem; background: #3b82f6; color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="box">
    <h1>You're Offline</h1>
    <p>RepoRadar needs an internet connection to fetch GitHub data.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
